name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches manifest
        shell: zsh {0}
        run: |
          set -euo pipefail
          version=$(/usr/bin/plutil -extract version raw -- plugin.json)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Build and test
        run: ./tests/run.sh
      - name: Publish package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 WhatsAppCall.dynamiclakeplugin.zip WhatsAppCall.dynamiclakeplugin.zip.sha256 --verify-tag --title "WhatsApp Call $GITHUB_REF_NAME" --notes-file CHANGELOG.md
