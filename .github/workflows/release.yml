name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches manifest
        shell: zsh {0}
        run: |
          set -euo pipefail
          version=$(/usr/bin/plutil -extract version raw -- plugin.json)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Build and test
        run: ./tests/run.sh
      - name: Publish package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(/usr/bin/plutil -extract version raw -- plugin.json)
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          python3 - "$version" "$notes" <<'PYTHON'
          import pathlib, sys
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          heading = f'## {sys.argv[1]}\n'
          if heading not in changelog:
              raise SystemExit('Missing release changelog section')
          notes = changelog.split(heading, 1)[1].split('\n## ', 1)[0].strip()
          if not notes:
              raise SystemExit('Empty release changelog section')
          pathlib.Path(sys.argv[2]).write_text(notes + '\n')
          PYTHON
          gh release create "$GITHUB_REF_NAME" \
            "dist/WhatsAppCall-$version.dynamiclakeplugin.zip" \
            "dist/WhatsAppCall-$version.dynamiclakeplugin.zip.sha256" \
            WhatsAppCall.dynamiclakeplugin.zip WhatsAppCall.dynamiclakeplugin.zip.sha256 \
            --verify-tag --title "WhatsApp Call $GITHUB_REF_NAME" --notes-file "$notes"
